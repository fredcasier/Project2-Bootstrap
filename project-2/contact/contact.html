<html>

<head>
    <title>GepaVu</title>
    <link rel="icon" type="image/x-icon" href="../img/logo.ico" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" type="text/css" href="../main.css" />
    <style>
        @media (min-width: 992px) {
            .navbar .dropdown:hover .dropdown-menu {
                display: block;
            }
        }
    </style>
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid">
                <a class="navbar-brand d-flex align-items-center gap-2" href="../home.html">
                    <img src="../img/logo.ico" alt="logo" width="32" height="32" class="rounded-circle">
                    <span>GepaVu</span>
                </a>
                <div class="collapse navbar-collapse">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" href="../home.html">Home</a>
                        </li>
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="../about/about.html">About Us</a>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="../team/team.html">Team</a></li>
                            </ul>
                        </li>
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="../store/store.html">Store</a>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="../store/reading_glasses/reading_glasses.html">Reading glasses</a></li>
                                <li><a class="dropdown-item" href="../store/sunglasses/sunglasses.html">Sunglasses</a></li>
                            </ul>
                        </li>
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="../news/news.html">News</a>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="../events/events.html">Events</a></li>
                            </ul>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="contact.html">Contact</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4 p-md-5">
                        <h2 class="card-title mb-4">Contact us</h2>
                        <form method="post" action="https://hnitest.go.yj.fr" class="contact-form">
                            <div class="mb-3">
                                <label for="lastname" class="form-label">Last name</label>
                                <input type="text" id="lastname" name="lastname" class="form-control" placeholder="Last name..." required />
                            </div>
                            <div class="mb-3">
                                <label for="firstname" class="form-label">First name</label>
                                <input type="text" id="firstname" name="firstname" class="form-control" placeholder="First name..." required />
                            </div>
                            <div class="mb-3">
                                <label for="mail" class="form-label">Email address</label>
                                <input type="email" id="mail" name="mail" class="form-control" placeholder="example@dot.com" required />
                            </div>
                            <div class="mb-3">
                                <label for="request" class="form-label">Request</label>
                                <textarea id="request" name="request" class="form-control" placeholder="Ask us anything" required></textarea>
                            </div>
                            <div class="mb-4">
                                <label for="country" class="form-label">Country</label>
                                <select id="country" name="country" class="form-select">
                                    <option>France</option>
                                    <option>Germany</option>
                                    <option>United Kingdom</option>
                                    <option>Netherland</option>
                                    <option>Spain</option>
                                    <option>Italy</option>
                                    <option>Listenbourg</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-primary submit-btn">Send message</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>

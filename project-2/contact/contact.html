            }

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid">
                <a class="navbar-brand d-flex align-items-center gap-2" href="../home.html">
                    <img src="../img/logo.ico" alt="logo" width="32" height="32" class="rounded-circle">
                    <span>GepaVu</span>
                </a>
                <div class="collapse navbar-collapse">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" href="../home.html">Home</a>
                        </li>
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="../about/about.html">About Us</a>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="../team/team.html">Team</a></li>
                            </ul>
                        </li>
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="../store/store.html">Store</a>
                            <ul class="dropdown-menu">

                                <li><a class="dropdown-item" href="../store/sunglasses/sunglasses.html">Sunglasses</a></li>

                        </li>

            </div>

    </header>
    <main>
        <form method="post" action="https://hnitest.go.yj.fr">
            <h2>Contact us</h2>
            Last name<br />
            <input type="text" name="lastname" placeholder="First name..." required/><br />
            First name<br />
            <input type="text" name="firstname" placeholder="Last name..." required/><br />
            Email address<br />
            <input type="email" name="mail" placeholder="example@dot.com" required/><br />
            Request<br />
            <textarea name="request" placeholder="Ask us anything" required></textarea><br />
            Country<br />
            <select name="country">
                <option>France</option>
                <option>Germany</option>
                <option>United Kingdom</option>
                <option>Netherland</option>
                <option>Spain</option>
                <option>Italy</option>
                <option>Listenbourg</option>
            </select>

            <input class="submit-btn" type="submit" value="Send message"/>
        </form>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
